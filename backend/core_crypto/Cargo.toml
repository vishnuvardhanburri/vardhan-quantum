[package]
name = "core_crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
ml-kem  = { version = "0.2", features = ["zeroize"] }
fips204 = { version = "0.4", features = ["default-rng"] }
blake3  = "1.5"
rand    = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1.0.229", features = ["derive"] }
aes-gcm = "0.11.1"
base64ct = { version = "1.8.3", features = ["alloc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

# P3.5.1: Optional real AWS KMS client (behind feature flag so default builds stay lean)
aws-sdk-kms    = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-config     = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
tokio          = { version = "1.38", optional = true, features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = []
aws-kms-real = ["aws-sdk-kms", "aws-config", "tokio"]

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "pq_crypto_benches"
harness = false
