name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build Workspace
      run: cargo build --workspace --verbose

    - name: Run Tests
      run: cargo test --workspace --verbose

  # ── P3.4: HA / Multi-Node Integration Test ──────────────────────────────────
  ha-integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Build Release Binaries
      run: cargo build --workspace

    - name: Run P3.4 HA Acceptance Gate
      run: bash tests/test_p3_ha_gate.sh
      timeout-minutes: 5

  # ── P3.5.3: Cross-Region HA Integration Test ────────────────────────────────
  cross-region-integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-xr

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Build Release Binaries
      run: cargo build --workspace

    - name: Run P3.5.3 Cross-Region HA Gate
      run: bash tests/test_p3_5_3_cross_region.sh
      timeout-minutes: 5

  # ── P3.6: K8s Manifest Security Linting ────────────────────────────────────
  manifest-lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Install kube-score
      run: |
        curl -L https://github.com/stefanprodan/kube-score/releases/download/v5.3.3/kube-score_5.3.3_linux_amd64.tar.gz -o /tmp/kube-score.tar.gz
        cd /tmp && tar xzf kube-score.tar.gz && sudo cp kube-score /usr/local/bin/

    - name: Score P3.4 + P3.5 k8s manifests
      run: |
        kube-score score \
          deploy_pack/k8s/statefulset.yaml \
          deploy_pack/k8s/service.yaml \
          deploy_pack/k8s/pdb.yaml \
          deploy_pack/k8s/regional-deployment.yaml \
          deploy_pack/k8s/secret.yaml \
          deploy_pack/k8s/networkpolicy.yaml \
          deploy_pack/k8s/namespace.yaml \
          --ignore-test container-security-context-user-group-id \
        || true  # Non-blocking: reports warnings

  # ── P3.6: Container Image Vulnerability Scanning ──────────────────────────────
  image-vuln-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-vuln

    - name: Build Docker image
      run: |
        docker build -f deploy_pack/Dockerfile -t pq-shield:${{ github.sha }} .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'pq-shield:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        ignore-unfixed: true

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

  # ── P3.6: Supply Chain SBOM + Image Signing ─────────────────────────────────
  supply-chain:
    runs-on: ubuntu-latest
    needs: [build, image-vuln-scan]
    permissions:
      contents: read
      id-token: write  # Required for cosign keyless signing (Fulcio + Rekor)
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f deploy_pack/Dockerfile -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
        echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

    - name: Install cosign + syft
      uses: sigstore/cosign-installer@v3.8.0
      with:
        cosign-version: v2.2.4
        syft-version: 1.10.0

    - name: Generate SBOM with Syft
      run: |
        syft ghcr.io/${{ github.repository }}:${{ github.sha }} -o spdx-json > sbom.spdx.json

    - name: Attach SBOM as OCI artifact
      run: |
        cosign attach \
          --sbom sbom.spdx.json \
          --type spdx-json \
          ghcr.io/${{ github.repository }}:${{ github.sha }}

    - name: Sign image with Cosign (keyless)
      run: |
        cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.spdx.json

  # ── P3.5.1: Live AWS KMS Validation (manual, requires AWS credentials) ─────
  aws-kms-validation:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-aws-kms

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Create CMK for testing
      id: kms-key
      run: |
        KEY_ID=$(aws kms create-key --description "Vardhan P3.5 CI KMS Key" --key-usage ENCRYPT_DECRYPT --customer-master-key-spec RSA_2048 --query 'KeyMetadata.KeyId' --output text)
        echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT

    - name: Build with aws-kms-real feature
      run: cargo build --features aws-kms-real -p core_crypto

    - name: Run live AWS KMS envelope round-trip test
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
        P3_5_KMS_KEY_ID: ${{ steps.kms-key.outputs.key_id }}
      run: |
        cargo test --features aws-kms-real -p core_crypto --test '*' -- test_live_aws_kms_envelope_roundtrip --exact --nocapture
        cargo test --features aws-kms-real -p core_crypto --test '*' -- test_live_aws_kms_access_denied --exact --nocapture

    - name: Enable KMS automatic key rotation
      run: |
        aws kms enable-key-rotation --key-id ${{ steps.kms-key.outputs.key_id }}
