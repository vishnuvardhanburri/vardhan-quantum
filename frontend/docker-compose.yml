# Vardhan Quantum Frontend — Docker Compose for Localhost
# Frontend in Docker, pq_shield running natively on host
version: "3.8"

services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Use host.docker.internal to reach pq_shield running on the host
      - VARDHAN_BACKEND_URL=http://host.docker.internal:8081
      - VARDHAN_INGRESS_URL=http://host.docker.internal:8080
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
