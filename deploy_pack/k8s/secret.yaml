# P3.6: Kubernetes Secret for admin API token.
# Operators must create this secret before deploying pq-shield:
#   kubectl create secret generic pq-shield-admin \
#     --namespace pq-shield \
#     --from-literal=token=$(openssl rand -hex 32)
#
# The secret is referenced by name in both statefulset.yaml and
# regional-deployment.yaml. Do NOT commit actual token values.
---
apiVersion: v1
kind: Secret
metadata:
  name: pq-shield-admin
  namespace: pq-shield
  labels:
    app: pq-shield
    p3.6-security: "true"
type: Opaque
stringData:
  token: "REPLACE_VIA_KUBECTL_CREATE_SECRET"
