# This is typically inlined into the StatefulSet, but providing here per the plan.
# To use as a patch (e.g. with Kustomize):
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pq-shield
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pq-shield
