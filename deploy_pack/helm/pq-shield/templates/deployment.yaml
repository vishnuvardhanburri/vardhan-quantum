apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pq-shield
  labels:
    app.kubernetes.io/name: pq-shield
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pq-shield
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pq-shield
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: pq-shield
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@sha256:{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TENANT_ID
              value: {{ .Values.tenant.id | quote }}
            - name: SLA_TIER
              value: {{ .Values.tenant.slaTier | quote }}
            - name: UPSTREAM_HOST
              value: {{ .Values.upstream.host | quote }}
            - name: UPSTREAM_PORT
              value: {{ .Values.upstream.port | quote }}
            - name: VARDHAN_ADMIN_CORS_ORIGIN
              value: {{ .Values.admin.corsOrigin | quote }}
            - name: VARDHAN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.tokenSecretName }}
                  key: {{ .Values.admin.tokenSecretKey }}
            {{- if .Values.capacity.maxConcurrency }}
            - name: VARDHAN_MAX_CONCURRENCY
              value: {{ .Values.capacity.maxConcurrency | quote }}
            {{- end }}
            {{- if .Values.capacity.maxConcurrencyPerIp }}
            - name: VARDHAN_MAX_CONCURRENCY_PER_IP
              value: {{ .Values.capacity.maxConcurrencyPerIp | quote }}
            {{- end }}
            {{- if .Values.capacity.handshakeTimeoutSecs }}
            - name: VARDHAN_HANDSHAKE_TIMEOUT_SECS
              value: {{ .Values.capacity.handshakeTimeoutSecs | quote }}
            {{- end }}
            {{- if .Values.capacity.idleTimeoutSecs }}
            - name: VARDHAN_IDLE_TIMEOUT_SECS
              value: {{ .Values.capacity.idleTimeoutSecs | quote }}
            {{- end }}
          ports:
            - name: http-ingress
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
